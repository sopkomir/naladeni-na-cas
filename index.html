:root{
  --night:#16100c; --night2:#21170f; --wood:#5a3520; --wood2:#7a4a2a; --wood3:#3b2214;
  --cream:#f6ead0; --paper:#efdfbd; --ink:#2a1a10; --muted:#b9a585; --muted2:#8d7a62;
  --amber:#ffc65a; --glow:#ffae35; --red:#d9472f; --eye:#46e39a; --ok:#4fd18b; --err:#ff6f6f;
  --line:rgba(246,234,208,.14); --st:#ffc65a;
  --r:18px; --fs:clamp(16px,1.05vw + 11px,18px);
  --head:'Fraunces',Georgia,serif; --body:'Figtree',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--cream);font:400 var(--fs)/1.55 var(--body);overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.08;margin:0;letter-spacing:-.01em}
p{margin:.6em 0}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:.78em}

/* ===== Rozloženie ===== */
#app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside.radio{display:none}
main{min-width:0;position:relative;overflow-x:clip}
@media (max-width:520px){ .lvchip{display:none} .top{gap:6px} .back{font-size:.95rem} }
@media (min-width:1000px){
  #app{grid-template-columns:minmax(380px,40vw) 1fr}
  aside.radio{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 26px;gap:16px;
    background:radial-gradient(120% 70% at 50% 0%,#3a2516 0%,var(--night2) 55%,#120c08 100%);border-right:1px solid var(--line);overflow:hidden}
  .phone-only{display:none!important}
}
@media (max-width:999px){ .wide-only{display:none!important} }

/* ===== Rádiogramofón (bočný panel) ===== */
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--head);font-size:1.25rem}
.brand .mono{color:var(--amber);font-size:.66rem}
.brand-btns{margin-left:auto;display:flex;gap:6px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(246,234,208,.08);border:1px solid var(--line)}
.ibtn:hover{background:rgba(246,234,208,.16)}
.ibtn svg{width:22px;height:22px}
.cab{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:34px 34px 20px 20px;padding:18px;gap:14px;position:relative;
  background:linear-gradient(180deg,var(--wood2),var(--wood) 40%,var(--wood3));box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.5)}
.deck{position:relative;flex:1;min-height:150px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#2c1d14,#140d09);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.deck svg{width:min(100%,560px);height:100%;max-height:min(100%,560px)}
.spin{transform-origin:50% 50%;transform-box:fill-box}
.playing .spin{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{transform-origin:86% 14%;transform-box:view-box;transition:transform .8s cubic-bezier(.5,0,.3,1);transform:rotate(-24deg)}
.playing .arm{transform:rotate(0deg)}
.nowcard{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 14px;min-height:64px;font-size:.86rem;display:flex;gap:12px;align-items:center}
.nowcard .t{font-weight:700;color:var(--cream)}
.nowcard .s{color:var(--muted);font-size:.78rem}
.nowcard .bar{height:4px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.nowcard .bar i{display:block;height:100%;width:0;background:var(--amber)}
.nowcard .stopb{margin-left:auto;flex:none}

/* ===== Ladiaca stupnica ===== */
.tuner{display:flex;flex-direction:column;gap:10px}
.dialwrap{display:flex;align-items:center;gap:10px}
.dial{position:relative;flex:1;height:96px;border-radius:14px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;
  background:linear-gradient(180deg,#3a2a10,#1d1408);box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),inset 0 0 30px rgba(255,170,50,.22)}
.dial:active{cursor:grabbing}
.dial .glass{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,220,140,.16),rgba(255,200,90,.05) 45%,rgba(0,0,0,.25));pointer-events:none;z-index:3}
.dial .scale{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.dial .tick{position:absolute;bottom:22px;width:1px;background:rgba(255,215,140,.55)}
.dial .st{position:absolute;top:12px;transform:translateX(-50%);text-align:center;white-space:nowrap;font-family:var(--mono);color:#ffd88a;text-shadow:0 0 8px rgba(255,170,40,.7);font-size:12px;letter-spacing:.12em;padding:4px 6px;border-radius:6px}
.dial .st small{display:block;font-size:10px;opacity:.75;letter-spacing:.06em}
.dial .st.got::after{content:'●';color:var(--eye);margin-left:4px;font-size:9px;vertical-align:2px}
.dial .needle::before{content:'';position:absolute;left:50%;top:-7px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--red);border-top:0}
.dial .needle{position:absolute;left:50%;top:50px;bottom:6px;width:3px;margin-left:-1.5px;background:var(--red);box-shadow:0 0 10px var(--red);z-index:2;border-radius:2px}
.dial .base{position:absolute;left:0;right:0;bottom:16px;height:1px;background:rgba(255,215,140,.5)}
.knob{width:70px;height:70px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b07a,#7b4b26 55%,#3b2213);box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 -3px 4px rgba(0,0,0,.4);position:relative;touch-action:none;cursor:grab}
.knob::before{content:'';position:absolute;inset:9px;border-radius:50%;background:repeating-conic-gradient(rgba(0,0,0,.18) 0 6deg,transparent 6deg 12deg)}
.knob i{position:absolute;left:50%;top:7px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--cream)}
.tunerow{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.tunerow .lbl{flex:1;min-width:0}
.tunerow .lbl b{color:var(--cream);font-family:var(--head);font-size:1.05rem;display:block;line-height:1.2}
.eye{width:40px;height:40px;flex:none;border-radius:50%;background:#06140c;box-shadow:inset 0 0 0 3px #0d2a18,0 0 0 2px rgba(0,0,0,.4);position:relative;overflow:hidden}
.eye::before{content:'';position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from calc(180deg - var(--open,80deg)/2),transparent 0 var(--open,80deg),var(--eye) var(--open,80deg) 360deg);filter:drop-shadow(0 0 6px var(--eye));transition:--open .2s}
.eye::after{content:'';position:absolute;inset:14px;border-radius:50%;background:#0b2416}
.arrbtn{width:44px;height:44px;border-radius:12px;background:rgba(246,234,208,.08);border:1px solid var(--line);display:grid;place-items:center;flex:none}

/* ===== Hlavná časť ===== */
.wrap{padding:0 clamp(16px,4vw,64px)}
.top{display:flex;align-items:center;gap:10px;padding:14px clamp(16px,4vw,64px);position:sticky;top:0;z-index:20;background:rgba(22,16,12,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .brand b{font-size:1.1rem}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;background:linear-gradient(180deg,var(--amber),var(--glow));color:#2a1606;box-shadow:0 6px 18px rgba(255,170,50,.25)}
.pill:hover{filter:brightness(1.05)}
.pill.ghost{background:rgba(246,234,208,.08);color:var(--cream);box-shadow:none;border:1px solid var(--line)}
.pill svg{width:18px;height:18px}
.pill[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

/* Úvod */
.hero{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .scene{position:absolute;inset:0}
.hero .scene svg{width:100%;height:100%;display:block}
.hero .txt{position:relative;z-index:2;padding:0 clamp(16px,4vw,64px) clamp(28px,6vh,64px);max-width:860px}
.stamp .mono{color:var(--amber)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,16,12,0) 25%,rgba(22,16,12,.7) 62%,var(--night) 100%);z-index:1}
.eyebrow{font-family:var(--mono);color:var(--amber);letter-spacing:.24em;font-size:.76rem;text-transform:uppercase}
.hero h1{font-size:clamp(2.6rem,7.5vw,5.8rem);margin:.18em 0 .12em;color:var(--cream)}
.hero h1 em{font-style:italic;color:var(--amber);font-weight:700}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.3rem);color:#e9dcc0;max-width:40em}

.sec{padding:clamp(36px,7vh,72px) 0;border-bottom:1px solid var(--line)}
.sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
.sechead .n{font-family:var(--mono);color:var(--amber);font-size:.9rem}
.sechead h2{font-size:clamp(1.6rem,3.2vw,2.4rem)}
.sec p.note{color:var(--muted);max-width:46em}

/* Úrovne – pásy cez celú šírku */
.levels{display:flex;flex-direction:column;gap:2px;border-radius:var(--r);overflow:hidden}
.lvl{display:flex;align-items:center;gap:18px;padding:16px clamp(14px,2.5vw,26px);text-align:left;background:rgba(246,234,208,.05);transition:background .2s}
.lvl:hover{background:rgba(246,234,208,.1)}
.lvl.on{background:linear-gradient(90deg,rgba(255,198,90,.28),rgba(255,198,90,.06))}
.lvl .av{width:76px;height:76px;flex:none}
.lvl h3{font-size:1.35rem}
.lvl .g{font-family:var(--mono);font-size:.72rem;color:var(--amber);letter-spacing:.12em}
.lvl p{margin:.2em 0 0;color:var(--muted);font-size:.95rem}
.lvl .ck{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.lvl.on .ck{background:var(--amber);border-color:var(--amber);color:#2a1606}

/* Zoznam staníc */
.stations{display:flex;flex-direction:column;gap:3px;margin-top:22px}
.strow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:14px clamp(12px,2vw,22px);text-align:left;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 6%,transparent) 70%);border-left:6px solid var(--c);transition:transform .15s}
.strow:hover{transform:translateX(4px)}
.strow.sel{outline:2px solid var(--c)}
.strow .no{font-family:var(--mono);font-size:1.5rem;color:var(--c);width:2.2ch}
.strow h3{font-size:clamp(1.1rem,2vw,1.4rem)}
.strow .y{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.strow .rec{width:44px;height:44px}

.preview{margin-top:18px;border-radius:var(--r);padding:clamp(18px,3vw,30px);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 34%,#1c140e),#1c140e 75%);display:grid;grid-template-columns:1fr;gap:16px;align-items:center;min-height:180px}
@media (min-width:700px){.preview{grid-template-columns:1fr 220px}}
.preview .big{font-family:var(--head);font-size:clamp(2rem,5vw,3.4rem);line-height:1}
.preview .scn{border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.preview .scn svg{width:100%;height:100%;display:block}

/* Polička s platňami */
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.4vw,16px);padding:18px;border-radius:var(--r);background:linear-gradient(180deg,#2a1b11,#1d130c);box-shadow:inset 0 -10px 0 #3b2416}
@media (min-width:700px){.shelf{grid-template-columns:repeat(10,1fr)}}
.sleeve{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15)}
.sleeve.got{background:var(--c);border:0;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.sleeve svg{width:78%;height:78%}
.sleeve span{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.6rem;color:rgba(0,0,0,.6)}

/* ===== Zastávka ===== */
.stophead{position:relative;min-height:clamp(260px,46vh,440px);display:flex;align-items:flex-end;overflow:hidden}
.stophead .scene{position:absolute;inset:0}
.stophead .scene svg{width:100%;height:100%;display:block}
.stophead .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,16,12,0) 30%,rgba(22,16,12,.85) 85%,var(--night))}
.stophead .txt{position:relative;z-index:2;padding:0 clamp(16px,4vw,64px) 26px;width:100%;display:flex;align-items:flex-end;gap:16px}
.stophead h1{font-size:clamp(2.2rem,6vw,4.4rem)}
.ring{width:66px;height:66px;flex:none;margin-left:auto}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted)}

.guide{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:26px 0}
.guide .av{width:72px;height:72px}
.bubble{max-width:62em;background:var(--cream);color:var(--ink);border-radius:4px 20px 20px 20px;padding:16px 20px;font-size:1.02rem;position:relative}
.bubble .who{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:#8a5a2b;text-transform:uppercase}
.bubble .read{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#8a3b1a;min-height:44px;white-space:nowrap}
.bubble .read svg{width:22px;height:22px;flex:none}
@media (max-width:520px){ .guide{grid-template-columns:48px 1fr;gap:10px} .guide .av{width:48px;height:48px} .bubble{padding:14px 16px} }

.band{margin:0 calc(-1*clamp(16px,4vw,64px));padding:clamp(22px,4vh,40px) clamp(16px,4vw,64px);border-top:1px solid var(--line)}
.band.tint{background:linear-gradient(180deg,color-mix(in srgb,var(--st) 12%,transparent),transparent)}
.band h2{font-size:clamp(1.35rem,2.6vw,1.9rem);margin-bottom:14px}
.band h2 .mono{display:block;color:var(--st);font-size:.72rem;margin-bottom:6px;font-family:var(--mono);font-weight:400}

.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(246,234,208,.05);text-align:left;border:1px solid transparent}
.clip:hover{border-color:var(--line)}
.clip.now{border-color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent)}
.clip .pb{width:48px;height:48px;border-radius:50%;background:var(--st);color:#20140b;display:grid;place-items:center}
.clip .pb svg{width:20px;height:20px}
.clip .t{font-weight:700;line-height:1.25}
.clip .s{font-size:.8rem;color:var(--muted)}
.clip .l{font-size:.72rem;color:var(--muted2)}
.clip .l a{color:var(--muted)}

.traits{list-style:none;padding:0;margin:0;display:grid;gap:10px;max-width:56em}
.traits li{padding-left:26px;position:relative}
.traits li::before{content:'♪';position:absolute;left:0;color:var(--st)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.person{padding:14px;border-radius:14px;background:rgba(246,234,208,.05);border-top:3px solid var(--st)}
.person b{font-family:var(--head);font-size:1.08rem;display:block}
.person .y{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.person p{font-size:.88rem;margin:.4em 0 0;color:#e2d4b8}
.person .sk{display:inline-block;font-family:var(--mono);font-size:.62rem;background:var(--st);color:#20140b;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:2px}
.skband{border-radius:var(--r);padding:18px 20px;background:linear-gradient(90deg,#1f3a63 0 33%,#e8e8e8 33% 66%,#c3312b 66%) top/100% 5px no-repeat,rgba(246,234,208,.06)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--cream);font-size:.9rem}
.links a:hover{background:rgba(246,234,208,.08)}
.links a svg{width:16px;height:16px}

/* Úlohy */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:999px;background:rgba(246,234,208,.07);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem}
.tab.on{background:var(--st);color:#20140b;border-color:var(--st)}
.tab.done::after{content:'✓';font-weight:900}
.task{margin-top:14px;border-radius:var(--r);background:var(--paper);color:var(--ink);padding:clamp(16px,3vw,28px);min-height:200px}
.task h3{font-size:1.3rem;margin-bottom:6px}
.task .help{color:#6b5236;font-size:.95rem;margin:.2em 0 14px}
.task .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:12px}
.opt{min-height:52px;padding:10px 16px;border-radius:14px;background:#fff8e8;border:2px solid #e2cfa6;text-align:left;font-weight:600;color:var(--ink);transition:transform .1s}
.opt:hover{border-color:#b88c4a}
.opt.ok{background:#d9f7e4;border-color:#2f9e60}
.opt.bad{background:#ffe1dc;border-color:#d0493a;animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:12px;font-weight:700;min-height:1.5em}
.fb.ok{color:#1f7a47}.fb.bad{color:#b23a2c}
.why{margin-top:8px;background:#fff3d6;border-left:4px solid #c48a2a;padding:10px 14px;border-radius:8px;font-size:.95rem}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;background:#2a1a10;color:var(--cream)}
.tbtn.alt{background:transparent;border:2px solid #2a1a10;color:#2a1a10}
.tbtn svg{width:18px;height:18px}
.listen{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#2a1a10;color:var(--cream)}
.listen .pb{width:56px;height:56px;border-radius:50%;background:var(--amber);color:#2a1606;display:grid;place-items:center;flex:none}
.listen .pb svg{width:24px;height:24px}
.listen small{color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cchip{min-height:44px;padding:8px 14px;border-radius:12px;background:#fff8e8;border:2px solid #e2cfa6;font-weight:600;color:var(--ink)}
.cchip.sel{border-color:#2a1a10;background:#2a1a10;color:var(--cream)}
.cchip.ok{background:#d9f7e4;border-color:#2f9e60;color:var(--ink)}
.cchip.used{opacity:.35}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:12px}
.bin{min-height:110px;border-radius:14px;border:2px dashed #b99a68;padding:10px;background:#f7ebcf;text-align:left;color:var(--ink)}
.bin b{display:block;font-family:var(--head);font-size:1.05rem;margin-bottom:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{font-size:.82rem;background:#fff;border-radius:8px;padding:4px 8px;border:1px solid #d8c39a}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px;background:#f7ebcf;margin-top:10px;align-items:center}
.seq span{background:#2a1a10;color:var(--cream);border-radius:10px;padding:6px 10px;font-size:.9rem}
.seq .ph{color:#9b8058;background:none;font-style:italic}
.mono-st{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.string{height:70px;position:relative;border-radius:12px;background:linear-gradient(90deg,#c58b4e,#a26b37);overflow:hidden}
.string .s{position:absolute;top:50%;left:6%;height:3px;background:#f6ead0;box-shadow:0 0 6px #fff;transform:translateY(-50%)}
.string .br{position:absolute;top:10px;bottom:10px;width:10px;border-radius:4px;background:#2a1a10}
input[type=range]{width:100%;accent-color:#2a1a10;height:44px}

.quizbox .q{font-family:var(--head);font-size:1.2rem;font-weight:700}
.stamp{display:flex;align-items:center;gap:18px;padding:22px;border-radius:var(--r);background:linear-gradient(120deg,color-mix(in srgb,var(--st) 40%,#1c140e),#1c140e);margin-top:16px}
.stamp svg{width:110px;height:110px;flex:none}
.stamp.spinin svg{animation:dropin .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes dropin{from{transform:translateY(-40px) rotate(-200deg);opacity:0}}
.clue{font-style:italic;color:#e8d6b2}

/* Spodný panel */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;z-index:61;padding:22px clamp(16px,4vw,48px) 30px;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.sheet.on{transform:none}
@media (min-width:1000px){.sheet{left:auto;right:24px;bottom:24px;width:min(560px,46vw);border-radius:22px;max-height:80vh}}
.sheet h3{font-size:1.5rem}
.sheet .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:#2a1a10;color:var(--cream);display:grid;place-items:center}
.gl{border-bottom:1px solid #d9c49b;padding:10px 0}
.gl b{font-family:var(--head)}
.term{border-bottom:2px dotted var(--amber);cursor:pointer;color:inherit;padding:0;font:inherit;text-align:inherit}
.task .term,.bubble .term{border-color:#b0782f}
.search{width:100%;min-height:48px;border-radius:12px;border:2px solid #d9c49b;padding:0 14px;font:inherit;background:#fff8e8;color:var(--ink);margin:10px 0}

/* Mini prehrávač (telefón) */
.mini{position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:#2a1a10;border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:none;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.mini.on{display:flex}
@media (min-width:1000px){.mini{display:none!important}}
.mini .rec{width:46px;height:46px;flex:none}
.mini .t{font-weight:700;font-size:.9rem;line-height:1.2}
.mini .s{font-size:.75rem;color:var(--muted)}
.mini .bar{height:3px;background:rgba(255,255,255,.12);margin-top:5px;border-radius:2px;overflow:hidden}
.mini .bar i{display:block;height:100%;width:0;background:var(--amber)}

/* Úvodná animácia stanice */
.intro{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--st) 30%,#16100c),#0d0907);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(20px,8vw,120px);gap:10px}
.intro .num{font-family:var(--head);font-size:clamp(6rem,22vw,15rem);line-height:.8;color:transparent;-webkit-text-stroke:2px var(--st);opacity:.9}
.intro .ln{font-family:var(--head);font-size:clamp(1.4rem,4vw,2.6rem);opacity:0;filter:blur(8px);transform:translateY(10px);transition:all .7s}
.intro .ln.on{opacity:1;filter:none;transform:none}
.intro .will{color:var(--muted);max-width:36em;opacity:0;transition:opacity .7s}
.intro .will.on{opacity:1}

/* Skúška a certifikát */
.timer{height:8px;border-radius:4px;background:#e2cfa6;overflow:hidden;margin:8px 0 14px}
.timer i{display:block;height:100%;background:#2a1a10;transition:width .25s linear}
.results{display:grid;gap:6px;margin:12px 0}
.results div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:#fff8e8}
.cert{background:#fffaf0;color:var(--ink);border:3px double #8a5a2b;border-radius:16px;padding:28px;text-align:center;margin-top:14px}
.cert h3{font-size:2rem}
.cert .nm{font-family:var(--head);font-size:1.8rem;border-bottom:2px solid #8a5a2b;display:inline-block;padding:0 20px;margin:10px 0}
.namein{min-height:48px;border-radius:12px;border:2px solid #d9c49b;padding:0 14px;font:inherit;background:#fff8e8;color:var(--ink)}

.teach table{width:100%;border-collapse:collapse;font-size:.92rem}
.teach td,.teach th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.teach th{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
.tablewrap{overflow-x:auto}
.credits{font-size:.82rem;color:var(--muted);columns:1}
@media (min-width:900px){.credits{columns:2;column-gap:30px}}
.credits p{break-inside:avoid;margin:0 0 8px}
footer{padding:30px clamp(16px,4vw,64px) 90px;color:var(--muted2);font-size:.85rem}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:90;opacity:0;transition:all .25s;font-weight:600;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Scény */
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.wv{animation:wv 7s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(-20px)}}
.dust{animation:dust 9s linear infinite}
@keyframes dust{from{transform:translateY(0)}to{transform:translateY(-60px);opacity:0}}
.eq{animation:eq 1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes eq{50%{transform:scaleY(.3)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff;color:#000}
  aside,.top,.mini,.noprint,footer,.tabs,.sheet,.sheet-bg{display:none!important}
  #app{display:block}
  .cert{border-color:#000;page-break-inside:avoid}
}

.hero{display:block;min-height:0}
.hero .scene{position:relative;height:clamp(280px,50vh,520px)}
.hero .shade{background:linear-gradient(180deg,rgba(22,16,12,0) 62%,var(--night) 100%);height:clamp(280px,50vh,520px);bottom:auto}
.hero .txt{padding-top:6px}

/* ===== Osobnosti, ľudia, zápis ===== */
.person{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.person .pic svg{width:72px;height:72px;display:block}
.humans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.human{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(246,234,208,.05)}
.human .hpic svg{width:64px;height:64px;display:block}
.human p{margin:0;font-size:.95rem}
.notaband{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:760px){.notaband{grid-template-columns:minmax(260px,420px) 1fr}}
.nimg svg{width:100%;height:auto;display:block;border-radius:10px}
.notapick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.npick{padding:6px;border-radius:12px;background:#fff8e8;border:2px solid #e2cfa6}
.npick svg{width:100%;height:auto;display:block}
.npick.ok{border-color:#2f9e60;opacity:.45}
.npick.bad{border-color:#d0493a;animation:shake .35s}
.notagal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.notagal figure{margin:0}
.notagal svg{width:100%;height:auto;display:block}
.notagal figcaption{font-size:.85rem;margin-top:4px;color:#4a3420}

/* ===== Dielňa ===== */
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.dtile{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(242,184,75,.22),rgba(242,184,75,.05));border-left:5px solid #f2b84b;text-align:left;font-size:.98rem}
.dtile .di{font-size:1.5rem;width:1.6em;text-align:center}
.dtile.done::after{content:'✓';margin-left:auto;color:var(--ok);font-weight:900}
.zvon{display:flex;align-items:flex-end;gap:clamp(2px,.6vw,6px);height:clamp(170px,30vh,250px);margin-top:14px;padding:12px;border-radius:16px;background:#3b2416;touch-action:manipulation}
.zvon .bar{flex:1;min-width:0;border-radius:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 30%,color-mix(in srgb,var(--c) 75%,#000));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:rgba(0,0,0,.65);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 #1d130c;transition:transform .08s}
.zvon .bar b{font-family:var(--mono);font-size:clamp(.8rem,2.2vw,1.15rem)}
.zvon .bar small{font-size:clamp(.6rem,1.5vw,.75rem)}
.zvon .bar.next{outline:4px solid #46e39a;outline-offset:2px}
.zvon .bar.hit{animation:hit .25s}
.zvon .bar.miss{filter:grayscale(.8) brightness(.8)}
@keyframes hit{50%{transform:translateY(5px) scale(.97)}}
.numseq{display:flex;gap:6px;overflow-x:auto;padding:10px 4px;margin-top:10px;scrollbar-width:thin}
.numseq span{flex:none;min-width:34px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:#fff8e8;border:2px solid #e2cfa6}
.numseq span.d{opacity:.35}
.numseq span.n{background:#46e39a;border-color:#1f7a47;transform:scale(1.12)}
.numseq span.ph{min-width:auto;padding:0 10px;font-family:var(--body);font-style:italic;font-weight:400;color:#8a7050;border:0;background:none}
.kb{display:flex;gap:4px;margin-top:12px;height:170px}
.kb .key{flex:1;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#fff,#efe6d2);border:2px solid #c9b18a;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px;color:var(--ink)}
.kb .key b{font-family:var(--head);font-size:1.15rem}
.kb .key small{font-family:var(--mono);color:#8a3b1a}
.kb .key.hit{background:#ffe4a3}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:8px}
.val{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border-radius:12px;background:#fff8e8;border:2px solid #e2cfa6;color:var(--ink)}
.val small{color:#6b5236}
.measure{display:flex;align-items:center;gap:6px;min-height:76px;padding:8px 12px;margin:10px 0;border-radius:12px;background:#fffaf0;border-left:3px solid var(--ink);border-right:3px solid var(--ink);flex-wrap:wrap}
.measure .tsig{display:flex;flex-direction:column;font-family:var(--head);font-size:1.4rem;line-height:.9;margin-right:6px}
.measure .left{margin-left:auto;font-size:.85rem;color:#6b5236}
.cchip svg{vertical-align:middle;width:18px;height:27px}

/* hlavička stanice: scéna nad textom, nie pod ním */
.stophead{display:block;min-height:0}
.stophead .scene{position:relative;height:clamp(220px,42vh,420px)}
.stophead .shade{height:clamp(220px,42vh,420px);bottom:auto;background:linear-gradient(180deg,rgba(22,16,12,0) 70%,var(--night) 100%)}
.stophead .txt{padding-top:14px;padding-bottom:6px}

</style>
</head>

function portrait(key){
  const p=PEOPLE[key]; if(!p) return '';
  const base=Object.assign({},LOOK[p.st]||{});
  const h=[...p.n].reduce((a,c)=>a+c.charCodeAt(0),0);
  base.skin=SKIN[h%3];
  const TOPS=['#2f4a6b','#7a2f3a','#3b5a3a','#5a3a6b','#8a5a2b','#2a2a40'];
  if(!['stredovek','antika','domov'].includes(p.st)) base.top=TOPS[h%TOPS.length];
  if(base.hair==='short'&&h%2) base.hair='curly'; if(!base.hairC) base.hairC=['#5a3218','#2a1a10','#8a5a2b','#b5532a','#3b2214'][h%5];
  if(p.f){ Object.assign(base,{dress:base.robe?null:base.top,ruff:0,jabot:0,tie:0,moustache:0,hat:p.st==='jazz'?'':base.hat}); if(!base.hood) base.hair=p.st==='barok'||p.st==='klasicizmus'?'bun':'long'; }
  if(p.look) Object.assign(base,p.look);
  if(h%3===0 && !p.f && ['romantizmus','moderna','dnes'].includes(p.st)) base.beard=1;
  const col=(STOPS.find(s=>s.id===p.st)||{color:'#ffc65a'}).color;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="${col}"/>

}

/* Kontrola dostupnosti ukážok priamo v prehliadači */
function probe(url){
  return new Promise(res=>{ const a=new Audio(); let t=setTimeout(()=>fin(false,'čas vypršal'),20000);
    const fin=(ok,info)=>{ clearTimeout(t); a.removeAttribute('src'); try{a.load();}catch(e){} res({ok,info}); };
    a.preload='metadata'; a.onloadedmetadata=()=>fin(true,Math.round(a.duration)+' s'); a.onerror=()=>fin(false,'chyba'); a.src=url; });
}
async function checkClips(out,btn){
  btn.disabled=true; out.replaceChildren(); let okN=0, mp3N=0;
  const sum=el('p',{style:{fontWeight:700,color:'var(--cream)'}},'Overujem…'); out.append(sum);
  for(const c of CLIPS){
    const line=el('p',null,'… '+c.t); out.append(line);
    let r=c.mp3?await probe(c.mp3):{ok:false}, how='MP3 (aj iPhone a iPad)';
    if(r.ok) mp3N++;
    if(!r.ok){ r=await probe(c.orig); how=c.mp3?'iba originál (na iPhone a iPade nemusí hrať)':'originál MP3'; if(r.ok&&!c.mp3) mp3N++; }
    if(r.ok) okN++;
    line.replaceChildren(el('b',{style:{color:r.ok?'var(--ok)':'var(--err)'}},r.ok?'✔ ':'✘ '),c.t+' – '+(r.ok?how+', '+r.info:'nedostupné')+' ',el('a',{href:c.page,target:'_blank',rel:'noopener'},'Commons'));
    sum.textContent='Overené: '+(CLIPS.indexOf(c)+1)+' z '+CLIPS.length;
  }
  sum.textContent=`Hotovo: hrá ${okN} z ${CLIPS.length} ukážok, z toho ${mp3N} vo formáte MP3, ktorý funguje aj na iPhone a iPade.`;
  btn.disabled=false;
}

  const b=el('div',{class:'listen','data-clip':cid},el('button',{class:'pb','data-clip':cid,'aria-label':'Prehrať ukážku',html:ic('play'),onclick:()=>playClip(cid,true)}),
    el('div',null,el('b',null,label||'Vypočuj si ukážku'),el('br'),el('small',null,'asi '+c.dur+' sekúnd'),el('div',{class:'bar',style:{height:'4px',background:'rgba(255,255,255,.15)',borderRadius:'3px',marginTop:'6px',width:'160px',overflow:'hidden'}},el('i',{class:'pbar',style:{display:'block',height:'100%',width:0,background:'var(--amber)'}}))));
  setTimeout(setPlayUI,0); return b;

function reveal(c,extra){ return 'Bola to skladba '+c.t+' ('+whoName(c)+(c.y?', '+c.y:'')+').'+(extra?' '+extra:''); }
/* výber z možností: opts = [{t,ok}], why = vysvetlenie po úspechu */
function mc(area,q,opts,done,why,reveal){
  let errs=0; const fb=el('div',{class:'fb','aria-live':'polite'}); const box=el('div',{class:'opts'});
  const btns=opts.map(o=>el('button',{class:'opt',onclick:()=>choose(o,btns[opts.indexOf(o)])},o.t));
  box.append(...btns);
  if(q) area.append(el('p',{style:{fontWeight:700,margin:'14px 0 0'}},q));
  area.append(box,fb);
  let over=false;
  function choose(o,b){
    if(over) return;
    if(o.ok){ over=true; unveil(); b.classList.add('ok'); btns.forEach(x=>x.disabled=true); beep(true); fb.className='fb ok'; fb.textContent='✔ Správne!'; if(why) area.append(el('div',{class:'why'},fmt(why))); done(); }
    else { errs++; b.classList.add('bad'); b.disabled=true; beep(false); fb.className='fb bad'; fb.textContent='✘ Ešte raz. '+(errs===1?'Vypočuj si ukážku znova a sústreď sa.':errs===2?'Vylúč možnosti, ktoré určite nesedia.':'');
      if(errs===3){ area.append(el('button',{class:'tbtn alt',style:{marginTop:'8px'},onclick:e=>{ e.target.remove(); over=true; unveil(); btns.forEach((x,k)=>{ x.disabled=true; if(opts[k].ok) x.classList.add('ok'); }); fb.className='fb'; fb.textContent='Toto je správna odpoveď. Skús Nový prípad.'; if(why) area.append(el('div',{class:'why'},fmt(why))); }},'Ukáž riešenie')); } }
  }
}
function poolFor(ctx,test){
  const upto=STOPS.slice(0,ctx.i+1).flatMap(s=>s.clips).map(i=>CL[i]).filter(test);
  const here=ctx.s.clips.map(i=>CL[i]).filter(test);
  const all=CLIPS.filter(test);
  return {here,upto,all};
}
function options(correct,pool,n){ return shuffle([correct,...shuffle(uniq(pool.filter(x=>x!==correct))).slice(0,n-1)]); }

function snd(freq,when,dur,kind,vol){

  const mk=(f,type,amp)=>{ const o=c.createOscillator(), gg=c.createGain(); o.type=type; o.frequency.value=f; gg.gain.value=amp; o.connect(gg).connect(g); o.start(t); o.stop(t+(dur||1)+1.2); };
  if(kind==='drum'){ const len=c.sampleRate*.12, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; s.connect(f).connect(g); g.gain.value=v; s.start(t); return; }
  if(kind==='klav'){ mk(freq,'triangle',1); mk(freq*2,'sine',.25); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.4,dur||1)+.6); return; }
  // zvonkohra
  mk(freq*2,'sine',1); mk(freq*2*2.76,'sine',.18); mk(freq*2*5.4,'sine',.05);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.001,t+1.4);

  for(let i=0;i<Math.ceil(total);i++) snd(2400,t0+i*beat,.05,'drum',.12);
  let acc=0; list.forEach(v=>{ if(!v.rest) snd(523.25,t0+acc*beat,v.d*beat,'klav',.3); acc+=v.d; });
}
